{% extends "base.html" %}
{% block content %}
<section class="cinema-reader-shell" data-project-id="{{ project_id }}" data-novel-id="{{ novel_id }}" data-current-user-id="{{ current_user_id or '' }}">
  <section class="cinema-reader-stage">
    <div class="cinema-reader-screen" id="cinemaReaderScreen">
      <div class="cinema-reader-still-wrap" id="cinemaReaderStillWrap">
        <div class="cinema-reader-placeholder">
          <i class="bi bi-film"></i>
          <span>Prebuilt Novel</span>
        </div>
      </div>
      <div class="cinema-reader-image-tools" id="cinemaReaderImageTools" hidden>
        <button class="cinema-reader-image-tool-button" type="button" id="cinemaReaderImageEditButton">
          <i class="bi bi-magic"></i>
          変更
        </button>
        <button class="cinema-reader-image-tool-button cinema-reader-image-delete-button" type="button" id="cinemaReaderImageDeleteButton" disabled>
          <i class="bi bi-trash"></i>
          画像削除
        </button>
        <button class="cinema-reader-image-tool-button cinema-reader-scene-delete-button" type="button" id="cinemaReaderSceneDeleteButton" disabled>
          <i class="bi bi-x-square"></i>
          シーン削除
        </button>
      </div>
      <div class="cinema-reader-textbox">
        <div class="cinema-reader-speaker" id="cinemaReaderSpeaker" hidden></div>
        <div class="cinema-reader-text" id="cinemaReaderText"></div>
        <div class="cinema-reader-footer">
          <div id="cinemaReaderPosition">-</div>
          <div class="cinema-reader-actions">
            <button class="btn btn-sm btn-outline-light" type="button" id="cinemaReaderBookmarkButton">
              <i class="bi bi-bookmark-check"></i>
              栞
            </button>
            <button class="btn btn-sm btn-outline-light" type="button" id="cinemaReaderInlinePrevButton">Prev</button>
            <button class="btn btn-sm btn-light" type="button" id="cinemaReaderNextButton">Next</button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <aside class="cinema-reader-side">
    <a class="btn btn-outline-dark w-100 mb-3" href="{{ url_for('ui.cinema_novel_list_page', project_id=project_id) }}">
      <i class="bi bi-arrow-left"></i>
      作品一覧へ
    </a>
    <h2 id="cinemaReaderTitle">Loading...</h2>
    <p id="cinemaReaderDescription"></p>
    <div class="cinema-reader-progress">
      <div class="cinema-reader-progress-bar" id="cinemaReaderProgressBar"></div>
    </div>
    <div class="cinema-reader-side-actions">
      <button class="btn btn-outline-dark" type="button" id="cinemaReaderPrevButton">Prev</button>
      <button class="btn btn-outline-dark" type="button" id="cinemaReaderContinueButton">続きから</button>
    </div>
    <label class="form-label mt-3" for="cinemaReaderChapterSelect">章</label>
    <select class="form-select" id="cinemaReaderChapterSelect"></select>
    <div class="cinema-reader-chapter-list" id="cinemaReaderChapterList"></div>
  </aside>
</section>

<div class="modal fade cinema-reader-edit-modal" id="cinemaReaderImageEditModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="cinemaReaderImageEditForm">
      <div class="modal-header">
        <h5 class="modal-title">画像を変更</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="閉じる"></button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="cinemaReaderImageEditPrompt">変更内容</label>
        <textarea class="form-control" id="cinemaReaderImageEditPrompt" rows="5" placeholder="例: ノアの衣装をドレスに変更する。背景のネオンを強める。"></textarea>
        <p class="cinema-reader-edit-help">
          現在表示中の画像をベースに再生成します。キャラクター名が入っている場合は、そのキャラクターの基準画像も参照します。
        </p>
        <label class="cinema-reader-upload-drop" id="cinemaReaderImageUploadDrop" for="cinemaReaderImageUploadInput">
          <input class="visually-hidden" id="cinemaReaderImageUploadInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <i class="bi bi-cloud-arrow-up"></i>
          <span>
            <strong id="cinemaReaderImageUploadLabel">画像を選択、またはドラッグ&ドロップ</strong>
            <small>現在のシーン画像として差し替えます</small>
          </span>
        </label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">キャンセル</button>
        <button type="submit" class="btn btn-primary" id="cinemaReaderImageEditSubmit">
          <span class="spinner-border spinner-border-sm me-2" hidden></span>
          変更する
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/cinema_novel_reader.js') }}"></script>
{% endblock %}
